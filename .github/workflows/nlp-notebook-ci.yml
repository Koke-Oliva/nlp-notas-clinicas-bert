name: NLP Notebook CI

on:
  pull_request:
    branches: [main]
    paths:
      - "nlp-notas-clinicas-bert.ipynb"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/nlp-notebook-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert ipykernel

      - name: Execute notebook end-to-end
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          TF_USE_LEGACY_KERAS: "1"
        run: |
          mkdir -p artifacts figures
          jupyter nbconvert             --to notebook             --execute nlp-notas-clinicas-bert.ipynb             --output artifacts/nlp-notas-clinicas-bert.executed.ipynb             --ExecutePreprocessor.timeout=3300

      - name: Promote executed notebook
        if: github.event_name == 'pull_request'
        run: |
          cp artifacts/nlp-notas-clinicas-bert.executed.ipynb nlp-notas-clinicas-bert.ipynb

      - name: Commit executed notebook and figures
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nlp-notas-clinicas-bert.ipynb figures/*.png
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] chore: refresh executed NLP notebook and figures"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-nlp-notebook
          path: artifacts/nlp-notas-clinicas-bert.executed.ipynb
          if-no-files-found: warn
